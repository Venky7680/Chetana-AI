global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    # Keep surfaces these on every alert, so the console can group by estate.
    monitor: chetana-lab

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: payments-api
    static_configs:
      - targets: ["payments-api:8000"]
        labels:
          service: payments-api
          environment: prod-uae
          team: cloud-ops

  - job_name: ledger-worker
    static_configs:
      - targets: ["ledger-worker:8000"]
        labels:
          service: ledger-worker
          environment: prod-uae
          team: cloud-ops

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus
          environment: shared
          team: cloud-ops
