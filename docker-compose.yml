# Chetana AI — local stack.
#
#   docker compose --profile real up -d --build   # the real thing (see below)
#   docker compose --profile demo up -d --build   # stub Keep, no real pipeline
#   docker compose up -d --build                  # BFF + console against your own Keep
#
# The `real` profile stands up a genuine alert pipeline:
#
#   loadgen ──HTTP──► payments-api ──HTTP──► ledger-worker
#                          │                      │
#                          └──── /metrics ────────┘
#                                    │
#                               Prometheus  (scrapes, evaluates rules)
#                                    │
#                              Alertmanager  (groups, inhibits, routes)
#                                    │
#                                   Keep  (dedup, correlate, workflows)
#                                    │
#                                   BFF  (allowlist, autonomy gate, audit)
#                                    │
#                                 console
#
# Nothing in that chain is simulated. The load is real HTTP, the saturation is
# real backpressure, and the alerts fire because the system actually degraded.
#
# Ports: Keep API 8080, Keep UI 3000, BFF 8090, console 3100,
#        Prometheus 9090, Alertmanager 9093, payments-api 8001, ledger-worker 8002.

name: chetana

x-keep-env: &keep-env
  AUTH_TYPE: NO_AUTH
  SECRET_MANAGER_TYPE: FILE
  SECRET_MANAGER_DIRECTORY: /state
  DATABASE_CONNECTION_STRING: sqlite:////state/db.sqlite3?check_same_thread=False
  PUSHER_APP_ID: "1"
  PUSHER_APP_KEY: keepappkey
  PUSHER_APP_SECRET: keepappsecret
  PUSHER_HOST: keep-websocket-server
  PUSHER_PORT: "6001"

services:
  # ============================================================ real Keep
  keep-backend:
    profiles: ["real", "keep"]
    image: us-central1-docker.pkg.dev/keephq/keep/keep-api
    ports:
      - "8080:8080"
    environment:
      <<: *keep-env
      PORT: "8080"
      KEEP_METRICS: "true"
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    volumes:
      # A bind mount, not a named volume. Keep's image runs as a non-root user,
      # and Docker creates a named volume root-owned, so Keep cannot create
      # /state/db.sqlite3 and dies during its alembic migration with
      # "unable to open database file". Bind mounts on Docker Desktop are
      # permissive, which is why Keep's own compose uses one.
      - ./state:/state

  keep-ui:
    profiles: ["real", "keep"]
    image: us-central1-docker.pkg.dev/keephq/keep/keep-ui
    ports:
      - "3000:3000"
    environment:
      AUTH_TYPE: NO_AUTH
      API_URL: http://keep-backend:8080
      NEXTAUTH_SECRET: local-dev-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8080
      PUSHER_HOST: localhost
      PUSHER_PORT: "6001"
      PUSHER_APP_KEY: keepappkey
    depends_on:
      - keep-backend

  keep-websocket-server:
    profiles: ["real", "keep"]
    image: quay.io/soketi/soketi:1.4-16-debian
    ports:
      - "6001:6001"
    environment:
      SOKETI_USER_AUTHENTICATION_TIMEOUT: "3000"
      SOKETI_DEFAULT_APP_ID: "1"
      SOKETI_DEFAULT_APP_KEY: keepappkey
      SOKETI_DEFAULT_APP_SECRET: keepappsecret

  # ================================================= the estate being watched
  ledger-worker:
    profiles: ["real"]
    build:
      context: ./ops/services
    command: ["uvicorn", "ledger_worker:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8002:8000"
    environment:
      WORKER_SLOTS: "8"
      WORKER_ROUNDS: "18000"

  payments-api:
    profiles: ["real"]
    build:
      context: ./ops/services
    command: ["uvicorn", "payments_api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8001:8000"
    environment:
      LEDGER_URL: http://ledger-worker:8000
      UPSTREAM_POOL: "12"
      UPSTREAM_TIMEOUT: "2.0"
    depends_on:
      - ledger-worker

  loadgen:
    profiles: ["real"]
    build:
      context: ./ops/services
    command: ["python", "loadgen.py"]
    environment:
      TARGET_URL: http://payments-api:8000
      LOAD_MIN: "2"
      LOAD_MAX: "26"
      LOAD_PERIOD_SECONDS: "420"
    depends_on:
      - payments-api

  # ================================================ monitoring and routing
  prometheus:
    profiles: ["real"]
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 15 days, not hours. An incident that has been flapping since yesterday
      # is normal, and a range query that silently stops at the edge of
      # retention looks exactly like a metric that was healthy before the
      # incident — which is how an RCA engine reaches a confident wrong answer.
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      - payments-api
      - alertmanager

  alertmanager:
    profiles: ["real"]
    image: prom/alertmanager:v0.28.0
    ports:
      - "9093:9093"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./ops/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

  # ------------------------------------------- stub Keep, for offline demos
  stub-keep:
    profiles: ["demo"]
    build:
      context: ./bff
    command: ["uvicorn", "tools.fake_keep:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8081:8080"

  # ===================================================== Chetana's own layer
  bff:
    build:
      context: ./bff
    ports:
      - "8090:8080"
    environment:
      - CHETANA_ENVIRONMENT=${CHETANA_ENVIRONMENT:-local}
      - CHETANA_JWT_SECRET=${CHETANA_JWT_SECRET:?set CHETANA_JWT_SECRET in .env}
      - CHETANA_TENANTS_JSON=${CHETANA_TENANTS_JSON:-/config/tenants.json}
      - CHETANA_USERS_JSON=${CHETANA_USERS_JSON:-/config/users.json}
      - CHETANA_GLOBAL_MAX_AUTONOMY_TIER=${CHETANA_GLOBAL_MAX_AUTONOMY_TIER:-1}
      - CHETANA_CORS_ORIGINS=["http://localhost:3100"]
      - CHETANA_AUDIT_LOG_PATH=/srv/data/audit.log
      - CHETANA_DATABASE_URL=${CHETANA_DATABASE_URL:-sqlite+aiosqlite:////srv/data/chetana.db}
      # Investigation engine. Empty disables it and the console hides the panel.
      - CHETANA_HOLMES_BASE_URL=${CHETANA_HOLMES_BASE_URL:-http://holmes:5050}
      - CHETANA_HOLMES_API_KEY=${CHETANA_HOLMES_API_KEY:-}
      - CHETANA_HOLMES_MODEL=${CHETANA_HOLMES_MODEL:-bedrock/us.anthropic.claude-sonnet-5}
      - CHETANA_EVIDENCE_CALLBACK_URL=http://bff:8080
      - CHETANA_EVIDENCE_BUDGET_PER_INVESTIGATION=${CHETANA_EVIDENCE_BUDGET_PER_INVESTIGATION:-40}
      - CHETANA_INVESTIGATIONS_PER_TENANT_PER_HOUR=${CHETANA_INVESTIGATIONS_PER_TENANT_PER_HOUR:-20}
      # Past ticket resolutions the investigation engine may search. Built
      # offline by ops/precedents/build_corpus.py. Point this at nothing and the
      # precedent tool is simply not granted — which is the right default until
      # an MSP has exported its own tickets, because a corpus from one client's
      # estate must never be searchable from another's investigation.
      - CHETANA_PRECEDENT_CORPUS_PATH=${CHETANA_PRECEDENT_CORPUS_PATH:-/precedents/corpus.json}
    volumes:
      - ./config:/config:ro
      - ./ops/precedents:/precedents:ro
      - bff-data:/srv/data

  # ---------------------------------------------------------------- Layer 5
  # HolmesGPT — the investigation engine.
  #
  # Deliberately given NO credentials for the client estate: no kubeconfig, no
  # cloud keys, no Keep API key. Its only view of the estate is the Chetana
  # evidence gateway, reached with a per-investigation token that the BFF mints
  # and passes as a request header. See ops/holmes/toolsets.yaml.
  #
  # The AWS credentials here are for Bedrock (the model), not for the estate.
  holmes:
    image: us-central1-docker.pkg.dev/genuine-flight-317411/devel/holmes
    profiles: ["real", "demo"]
    environment:
      # --- Bedrock (model access only) ---
      # A Bedrock API key is a bearer token and is all that is needed; LiteLLM
      # reads it from AWS_BEARER_TOKEN_BEDROCK. The IAM variables below are the
      # fallback for deployments that use a role or long-lived access keys
      # instead, and stay empty when an API key is set.
      - AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK:-}
      # Still required with an API key: the key is issued per region, and the
      # region is what builds the endpoint.
      - AWS_REGION_NAME=${AWS_REGION_NAME:-us-east-1}
      - AWS_DEFAULT_REGION=${AWS_REGION_NAME:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      # NOTE the "us." prefix. Newer Anthropic models on Bedrock cannot be
      # invoked by their bare model id — Bedrock answers "Invocation of model ID
      # ... with on-demand throughput isn't supported" and asks for an inference
      # profile. The prefix selects the cross-region inference profile and must
      # match the region family: us. / eu. / apac.
      - MODEL=${CHETANA_HOLMES_MODEL:-bedrock/us.anthropic.claude-sonnet-5}
      # --- Protect the endpoint on the shared compose network ---
      - HOLMES_API_KEY=${CHETANA_HOLMES_API_KEY:-}
      # --- Where the evidence gateway lives (the toolset reads this) ---
      - CHETANA_EVIDENCE_URL=http://bff:8080
      # NOTE: built-in toolsets are switched off individually in
      # ops/holmes/config.base.yaml, NOT here. ENABLED_BY_DEFAULT_TOOLSETS was
      # tried first and left bash, kubectl-run and internet enabled, which is
      # exactly the unsupervised access the evidence gateway exists to prevent.
    volumes:
      # Mounted somewhere neutral, not at ~/.holmes: the entrypoint below has to
      # write a generated config.yaml into ~/.holmes, and this mount is read-only.
      - ./ops/holmes:/etc/chetana/holmes:ro
    # In server mode Holmes only picks up custom toolsets from a config file at
    # ~/.holmes/config.yaml — there is no environment variable for it. But the
    # moment that file exists, Holmes loads its whole config from the file and
    # stops reading MODEL from the environment. A static config.yaml would
    # therefore silently drift from CHETANA_HOLMES_MODEL, so it is generated
    # here from the same variable and there is still one source of truth.
    #
    # (The Bedrock credentials are unaffected either way — LiteLLM reads
    # AWS_BEARER_TOKEN_BEDROCK straight from the process environment.)
    #
    # The upstream entrypoint's kubeconfig rewriting is skipped: there is no
    # kubeconfig here, by design.
    # NOTE: $${MODEL} below, not ${MODEL}. Compose interpolates $VAR in the
    # compose file itself before the container starts, so a single $ would be
    # substituted here (to an empty string, since MODEL lives on the container,
    # not in .env) and the shell would never see it. $$ escapes it for the shell.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /root/.holmes
        cp /etc/chetana/holmes/toolsets.yaml /root/.holmes/toolsets.yaml
        cp /etc/chetana/holmes/config.base.yaml /root/.holmes/config.base.yaml
        printf 'model: %s\n' "$${MODEL}" > /root/.holmes/config.yaml
        cat /root/.holmes/config.base.yaml >> /root/.holmes/config.yaml
        echo "chetana: generated /root/.holmes/config.yaml for model $${MODEL}"
        exec python -u server.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_BFF_URL: http://localhost:8090
    ports:
      - "3100:3000"
    depends_on:
      - bff

volumes:
  bff-data:
  prometheus-data:
  alertmanager-data:
